name: Check OpenAI TLS trust anchor

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract embedded root certificate
        run: sed -n '/BEGIN CERTIFICATE/,/END CERTIFICATE/p' include/openai_root_ca.h > /tmp/openai-root.pem
      - name: Verify live api.openai.com chain against embedded root
        run: |
          openssl s_client -connect api.openai.com:443 -servername api.openai.com -showcerts </dev/null 2>/dev/null > /tmp/chain.txt
          awk '/BEGIN CERTIFICATE/{n++} n==1{print}' /tmp/chain.txt > /tmp/leaf.pem
          awk '/BEGIN CERTIFICATE/{n++} n>=2{print}' /tmp/chain.txt > /tmp/intermediates.pem
          openssl verify -CAfile /tmp/openai-root.pem -untrusted /tmp/intermediates.pem /tmp/leaf.pem
