name: Build firmware and publish web flasher

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: pip install "platformio==6.1.19"
      - name: Build all supported boards
        run: pio run
      - name: Package ESP Web Tools site
        run: python scripts/package_web.py --version "${GITHUB_REF_NAME}"
      - name: Validate packaged web flasher
        run: python scripts/validate_web.py dist
      - name: Validate secret hygiene
        run: |
          if git grep -n -E 'sk-[A-Za-z0-9_-]{16,}'; then
            echo "Potential OpenAI key found" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: limen-esp32-codex-firmware
          path: dist/
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
