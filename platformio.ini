[platformio]
core_dir = .platformio-core
default_envs =
  esp32dev
  esp32-s3-devkitc-1
  esp32-c3-devkitm-1

[env]
platform = espressif32@6.12.0
framework = arduino
monitor_speed = 115200
upload_speed = 460800
lib_deps =
  bblanchon/ArduinoJson@^7.4.2
build_flags =
  -DCORE_DEBUG_LEVEL=1

[env:esp32dev]
board = esp32dev

[env:esp32-s3-devkitc-1]
board = esp32-s3-devkitc-1
build_flags =
  ${env.build_flags}
  -DARDUINO_USB_CDC_ON_BOOT=0

[env:esp32-c3-devkitm-1]
board = esp32-c3-devkitm-1
build_flags =
  ${env.build_flags}
  -DARDUINO_USB_CDC_ON_BOOT=0
